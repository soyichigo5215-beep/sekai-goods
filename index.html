<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>プロセカ グッズ＆求め管理</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="プロセカ管理">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#fdf2f8">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .bg-overlay {
      background-color: rgba(255, 241, 242, 0.7);
      min-height: 100vh;
    }
  </style>
</head>
<body class="text-slate-700 min-h-screen antialiased selection:bg-pink-200">
  <div id="root" class="bg-overlay pb-28"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- データ定義 ---
    const UNITS = [
      { id: 'vs', name: 'バーチャル・シンガー', color: 'bg-teal-50 text-teal-700 border-teal-200' },
      { id: 'ln', name: 'Leo/need', color: 'bg-sky-50 text-sky-700 border-sky-200' },
      { id: 'mmj', name: 'MORE MORE JUMP！', color: 'bg-lime-50 text-lime-700 border-lime-200' },
      { id: 'vbs', name: 'Vivid BAD SQUAD', color: 'bg-rose-50 text-rose-700 border-rose-200' },
      { id: 'wxs', name: 'ワンダーランズ×ショウタイム', color: 'bg-amber-50 text-amber-700 border-amber-200' },
      { id: 'niigo', name: '25時、ナイトコードで。', color: 'bg-purple-50 text-purple-700 border-purple-200' },
    ];

    const CHARACTERS = [
      { id: 'miku', name: '初音ミク', unit: 'vs' }, { id: 'rin', name: '鏡音リン', unit: 'vs' }, { id: 'len', name: '鏡音レン', unit: 'vs' }, { id: 'luka', name: '巡音ルカ', unit: 'vs' }, { id: 'meiko', name: 'MEIKO', unit: 'vs' }, { id: 'kaito', name: 'KAITO', unit: 'vs' },
      { id: 'ichika', name: '星乃一歌', unit: 'ln' }, { id: 'saki', name: '天馬咲希', unit: 'ln' }, { id: 'honami', name: '望月穂波', unit: 'ln' }, { id: 'shiho', name: '日野森志歩', unit: 'ln' },
      { id: 'minori', name: '花里みのり', unit: 'mmj' }, { id: 'haruka', name: '桐谷遥', unit: 'mmj' }, { id: 'airi', name: '桃井愛莉', unit: 'mmj' }, { id: 'shizuku', name: '日野森雫', unit: 'mmj' },
      { id: 'kohane', name: '小豆沢こはね', unit: 'vbs' }, { id: 'an', name: '白石杏', unit: 'vbs' }, { id: 'akito', name: '東雲彰人', unit: 'vbs' }, { id: 'toya', name: '青柳冬弥', unit: 'vbs' },
      { id: 'tsukasa', name: '天馬司', unit: 'wxs' }, { id: 'emu', name: '鳳えむ', unit: 'wxs' }, { id: 'nene', name: '草薙寧々', unit: 'wxs' }, { id: 'rui', name: '神代類', unit: 'wxs' },
      { id: 'kanade', name: '宵崎奏', unit: 'niigo' }, { id: 'mafuyu', name: '朝比奈まふゆ', unit: 'niigo' }, { id: 'ena', name: '東雲絵名', unit: 'niigo' }, { id: 'mizuki', name: '暁山瑞希', unit: 'niigo' },
    ];

    const ITEM_TYPES = ['エピカ', 'エピカ(箔押し)', 'ぱしゃこれ', 'メモステ', 'メモステ(箔押し)', '色紙', '特典', 'はぴこれ', '缶バッジ', 'アクリルスタンド', 'キーホルダー', 'クリアファイル', 'その他'];

    const STATUS_OPTIONS = [
      { label: '譲', bg: 'bg-pink-100 text-pink-700 border-pink-200' },
      { label: '求', bg: 'bg-sky-100 text-sky-700 border-sky-200' },
      { label: '所持', bg: 'bg-emerald-100 text-emerald-700 border-emerald-200' },
      { label: '交換中', bg: 'bg-amber-100 text-amber-700 border-amber-200' },
      { label: '譲渡予定', bg: 'bg-indigo-100 text-indigo-700 border-indigo-200' },
      { label: '保留', bg: 'bg-purple-100 text-purple-700 border-purple-200' },
    ];

    // --- 優先度 4択定義 ---
    const PRIORITIES = [
      { id: '最優先', label: '最優先', color: 'bg-rose-500 text-white shadow-sm shadow-rose-200' },
      { id: '優先', label: '優先', color: 'bg-pink-400 text-white shadow-sm shadow-pink-200' },
      { id: '求', label: '求', color: 'bg-sky-400 text-white shadow-sm shadow-sky-200' },
      { id: '緩求', label: '緩求', color: 'bg-slate-400 text-white' },
    ];

    const getPriorityConf = (prio) => {
      if (typeof prio === 'number') {
        if (prio >= 5) return PRIORITIES[0];
        if (prio === 4) return PRIORITIES[1];
        if (prio === 3) return PRIORITIES[2];
        return PRIORITIES[3];
      }
      return PRIORITIES.find(p => p.id === prio) || PRIORITIES[0];
    };

    // --- DB処理 ---
    const DB_NAME = 'SekaiGoodsStorage';
    const DB_STORE = 'goods';
    const openDB = () => new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(DB_STORE, { keyPath: 'id' });
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });

    const loadAllItems = async () => {
      try {
        const db = await openDB();
        return new Promise(resolve => {
          const req = db.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve([]);
        });
      } catch (e) { return []; }
    };
    const saveItemDB = async (item) => {
      const db = await openDB();
      db.transaction(DB_STORE, 'readwrite').objectStore(DB_STORE).put(item);
    };
    const deleteItemDB = async (id) => {
      const db = await openDB();
      db.transaction(DB_STORE, 'readwrite').objectStore(DB_STORE).delete(id);
    };

    // --- 初期フォーム状態 ---
    const initialGoodsForm = { id: '', isWanted: false, name: '', type: 'エピカ', units: [], characters: [], statuses: ['譲'], count: 1, memo: '', image: '' };
    const initialWantedForm = { id: '', isWanted: true, name: '', types: ['エピカ'], units: [], characters: [], priority: '最優先', memo: '', image: '', aspect: 'square' };

    function App() {
      const [items, setItems] = useState([]);
      const [activeTab, setActiveTab] = useState('inventory'); // 'inventory' | 'wanted'
      
      const [isGoodsModalOpen, setIsGoodsModalOpen] = useState(false);
      const [isWantedModalOpen, setIsWantedModalOpen] = useState(false);
      const [isFilterOpen, setIsFilterOpen] = useState(false);
      const [previewImage, setPreviewImage] = useState(null);

      const [goodsForm, setGoodsForm] = useState(initialGoodsForm);
      const [wantedForm, setWantedForm] = useState(initialWantedForm);

      // トリミング用状態
      const [cropModalOpen, setCropModalOpen] = useState(false);
      const [rawImageSrc, setRawImageSrc] = useState(null);
      const [cropAspect, setCropAspect] = useState('square');
      const [cropZoom, setCropZoom] = useState(1.0);
      const [cropPosX, setCropPosX] = useState(50);
      const [cropPosY, setCropPosY] = useState(50);
      const canvasRef = useRef(null);
      const rawImageRef = useRef(null);

      // 検索・絞り込み状態
      const [searchTerm, setSearchTerm] = useState('');
      const [filterTypes, setFilterTypes] = useState([]);
      const [filterUnits, setFilterUnits] = useState([]);
      const [filterCharacters, setFilterCharacters] = useState([]);
      const [filterStatuses, setFilterStatuses] = useState([]);
      const [filterPriorities, setFilterPriorities] = useState([]);

      const goodsFileInputRef = useRef(null);
      const wantedFileInputRef = useRef(null);

      useEffect(() => { loadAllItems().then(setItems); }, []);

      const inventoryItems = useMemo(() => items.filter(i => !i.isWanted), [items]);
      const wantedItems = useMemo(() => items.filter(i => i.isWanted), [items]);

      const openAddGoods = () => { setGoodsForm({ ...initialGoodsForm, id: 'goods_' + Date.now() }); setIsGoodsModalOpen(true); };
      const openEditGoods = (item) => {
        setGoodsForm({
          id: item.id, isWanted: false, name: item.name || '', type: item.type || 'エピカ',
          units: item.units || [], characters: item.characters || [], statuses: item.statuses || ['譲'],
          count: item.count || 1, memo: item.memo || '', image: item.image || ''
        });
        setIsGoodsModalOpen(true);
      };

      const openAddWanted = () => { setWantedForm({ ...initialWantedForm, id: 'wanted_' + Date.now() }); setIsWantedModalOpen(true); };
      const openEditWanted = (item) => {
        setWantedForm({
          id: item.id, isWanted: true, name: item.name || '', types: item.types || ['エピカ'],
          units: item.units || [], characters: item.characters || [],
          priority: getPriorityConf(item.priority).id,
          memo: item.memo || '', image: item.image || '', aspect: item.aspect || 'square'
        });
        setIsWantedModalOpen(true);
      };

      const handleSave = async (dataToSave, closeModal) => {
        await saveItemDB(dataToSave);
        setItems(prev => {
          const idx = prev.findIndex(i => i.id === dataToSave.id);
          return idx >= 0 ? [...prev.slice(0,idx), dataToSave, ...prev.slice(idx+1)] : [dataToSave, ...prev];
        });
        closeModal();
      };

      const handleDelete = async (id) => {
        if (!confirm('削除してよろしいですか？')) return;
        await deleteItemDB(id);
        setItems(prev => prev.filter(i => i.id !== id));
      };

      // --- トリミング処理 ---
      const handleWantedImagePick = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          setRawImageSrc(evt.target.result);
          setCropZoom(1.0);
          setCropPosX(50);
          setCropPosY(50);
          setCropModalOpen(true);
        };
        reader.readAsDataURL(file);
      };

      useEffect(() => {
        if (!cropModalOpen || !rawImageSrc || !canvasRef.current) return;
        const img = new Image();
        img.src = rawImageSrc;
        rawImageRef.current = img;
        img.onload = () => drawCropPreview();
      }, [cropModalOpen, rawImageSrc, cropAspect, cropZoom, cropPosX, cropPosY]);

      const getAspectDimensions = (aspect) => {
        if (aspect === 'landscape') return { w: 600, h: 450 };
        if (aspect === 'portrait') return { w: 450, h: 600 };
        return { w: 500, h: 500 };
      };

      const drawCropPreview = () => {
        const canvas = canvasRef.current;
        const img = rawImageRef.current;
        if (!canvas || !img) return;
        const ctx = canvas.getContext('2d');
        const { w: outW, h: outH } = getAspectDimensions(cropAspect);
        canvas.width = outW;
        canvas.height = outH;

        const targetRatio = outW / outH;
        const imgRatio = img.width / img.height;

        let baseCropW, baseCropH;
        if (imgRatio > targetRatio) {
          baseCropH = img.height;
          baseCropW = img.height * targetRatio;
        } else {
          baseCropW = img.width;
          baseCropH = img.width / targetRatio;
        }

        const cropW = baseCropW / cropZoom;
        const cropH = baseCropH / cropZoom;

        const maxOffsetX = img.width - cropW;
        const maxOffsetY = img.height - cropH;

        const sourceX = Math.max(0, Math.min(img.width - cropW, maxOffsetX * (cropPosX / 100)));
        const sourceY = Math.max(0, Math.min(img.height - cropH, maxOffsetY * (cropPosY / 100)));

        ctx.clearRect(0, 0, outW, outH);
        ctx.drawImage(img, sourceX, sourceY, cropW, cropH, 0, 0, outW, outH);
      };

      const confirmCrop = () => {
        if (!canvasRef.current) return;
        const croppedBase64 = canvasRef.current.toDataURL('image/jpeg', 0.85);
        setWantedForm(p => ({ ...p, image: croppedBase64, aspect: cropAspect }));
        setCropModalOpen(false);
      };

      const toggleArray = (setter, value) => {
        setter(prev => prev.includes(value) ? prev.filter(v => v !== value) : [...prev, value]);
      };

      const activeList = activeTab === 'inventory' ? inventoryItems : wantedItems;

      const filteredList = useMemo(() => {
        return activeList.filter(item => {
          const name = item.name || '';
          const memo = item.memo || '';
          const chars = (item.characters || []).map(cid => CHARACTERS.find(c => c.id === cid)?.name || '').join(' ');
          const searchMatch = !searchTerm || (name + ' ' + memo + ' ' + chars).toLowerCase().includes(searchTerm.toLowerCase());

          let typeMatch = true;
          if (filterTypes.length > 0) {
            if (item.isWanted) {
              typeMatch = (item.types || []).some(t => filterTypes.includes(t));
            } else {
              typeMatch = filterTypes.includes(item.type);
            }
          }

          const unitMatch = filterUnits.length === 0 || (item.units || []).some(u => filterUnits.includes(u));
          const charMatch = filterCharacters.length === 0 || (item.characters || []).some(c => filterCharacters.includes(c));
          
          let statusMatch = true;
          if (!item.isWanted && filterStatuses.length > 0) {
            statusMatch = (item.statuses || []).some(s => filterStatuses.includes(s));
          }

          let priorityMatch = true;
          if (item.isWanted && filterPriorities.length > 0) {
            const currentPrio = getPriorityConf(item.priority).id;
            priorityMatch = filterPriorities.includes(currentPrio);
          }

          return searchMatch && typeMatch && unitMatch && charMatch && statusMatch && priorityMatch;
        });
      }, [activeList, searchTerm, filterTypes, filterUnits, filterCharacters, filterStatuses, filterPriorities]);

      const activeFilterCount = filterTypes.length + filterUnits.length + filterCharacters.length + (activeTab === 'inventory' ? filterStatuses.length : filterPriorities.length);

      return (
        <div className="max-w-2xl mx-auto px-4 py-6">
          {/* ヘッダー */}
          <header className="mb-4 pb-2 border-b border-rose-200">
            <h1 className="text-2xl font-bold bg-gradient-to-r from-pink-500 to-rose-400 bg-clip-text text-transparent">
              プロセカ グッズ管理
            </h1>
            <p className="text-xs text-rose-400 mt-0.5">グッズ在庫 & 求め絵柄コレクション</p>
          </header>

          {/* メインタブ切り替え */}
          <div className="flex bg-rose-100/60 p-1 rounded-2xl mb-5 shadow-inner">
            <button
              onClick={() => { setActiveTab('inventory'); setSearchTerm(''); }}
              className={`flex-1 py-2.5 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 transition-all ${
                activeTab === 'inventory' ? 'bg-white text-rose-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'
              }`}
            >
              <span>📦</span> 在庫・所持グッズ
              <span className="text-[10px] px-1.5 py-0.2 bg-rose-50 text-rose-500 rounded-full">{inventoryItems.length}</span>
            </button>
            <button
              onClick={() => { setActiveTab('wanted'); setSearchTerm(''); }}
              className={`flex-1 py-2.5 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 transition-all ${
                activeTab === 'wanted' ? 'bg-white text-pink-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'
              }`}
            >
              <span>💖</span> 求め絵柄
              <span className="text-[10px] px-1.5 py-0.2 bg-pink-50 text-pink-500 rounded-full">{wantedItems.length}</span>
            </button>
          </div>

          {/* 検索・絞り込みバー */}
          <section className="bg-white/90 p-3.5 rounded-2xl shadow-sm border border-rose-100 mb-5 flex gap-2">
            <input
              type="text"
              placeholder={activeTab === 'inventory' ? "🔍 グッズ名・キャラ名・メモ" : "🔍 絵柄名・キャラ名・求メモ"}
              value={searchTerm}
              onChange={e => setSearchTerm(e.target.value)}
              className="flex-1 px-3 py-2 rounded-xl border border-rose-200 bg-rose-50/20 text-xs focus:outline-none focus:ring-2 focus:ring-rose-300"
            />
            <button
              onClick={() => setIsFilterOpen(true)}
              className="px-3.5 py-2 bg-rose-50 text-rose-600 border border-rose-200 rounded-xl text-xs font-bold flex items-center gap-1 relative"
            >
              絞り込み
              {activeFilterCount > 0 && (
                <span className="absolute -top-1.5 -right-1.5 bg-pink-500 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center">
                  {activeFilterCount}
                </span>
              )}
            </button>
          </section>

          {/* 絞り込み中タグ */}
          {activeFilterCount > 0 && (
            <div className="flex flex-wrap items-center gap-1 mb-4 px-1">
              <span className="text-[11px] text-slate-400">適用中:</span>
              {filterTypes.map(f => <span key={f} className="text-[10px] bg-rose-100 text-rose-700 px-2 py-0.5 rounded-md">{f}</span>)}
              {filterUnits.map(u => <span key={u} className="text-[10px] bg-sky-100 text-sky-700 px-2 py-0.5 rounded-md">{UNITS.find(x=>x.id===u)?.name}</span>)}
              {filterCharacters.map(c => <span key={c} className="text-[10px] bg-purple-100 text-purple-700 px-2 py-0.5 rounded-md">{CHARACTERS.find(x=>x.id===c)?.name}</span>)}
              {activeTab === 'inventory' && filterStatuses.map(s => <span key={s} className="text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-md">{s}</span>)}
              {activeTab === 'wanted' && filterPriorities.map(p => <span key={p} className="text-[10px] bg-rose-100 text-rose-700 px-2 py-0.5 rounded-md">{p}</span>)}
              <button onClick={() => { setFilterTypes([]); setFilterUnits([]); setFilterCharacters([]); setFilterStatuses([]); setFilterPriorities([]); }} className="text-[10px] text-red-400 underline ml-2">クリア</button>
            </div>
          )}

          {/* --- 一覧表示エリア --- */}
          {activeTab === 'inventory' ? (
            /* ================= 在庫グッズ一覧 ================= */
            <div className="space-y-3.5">
              {filteredList.length === 0 ? (
                <div className="text-center py-14 bg-white/70 border border-dashed border-rose-200 rounded-3xl p-6">
                  <div className="text-3xl mb-2">📦</div>
                  <p className="text-slate-500 font-medium text-xs">登録されているグッズがありません</p>
                  <p className="text-[11px] text-rose-400 mt-1">右下の「＋」ボタンから追加できます</p>
                </div>
              ) : (
                filteredList.map(item => {
                  const itemChars = (item.characters || []).map(cid => CHARACTERS.find(c => c.id === cid)).filter(Boolean);
                  return (
                    <div key={item.id} className="bg-white rounded-2xl border border-rose-100 shadow-sm overflow-hidden flex flex-col sm:flex-row">
                      {item.image ? (
                        <div className="sm:w-32 h-44 sm:h-auto bg-slate-50 cursor-pointer overflow-hidden flex-shrink-0" onClick={() => setPreviewImage(item.image)}>
                          <img src={item.image} alt={item.name} className="w-full h-full object-cover" />
                        </div>
                      ) : (
                        <div className="sm:w-28 h-16 sm:h-auto bg-rose-50/50 flex items-center justify-center text-rose-200 text-xl flex-shrink-0">✨</div>
                      )}
                      <div className="p-3.5 flex-1 flex flex-col justify-between">
                        <div>
                          <div className="flex flex-wrap items-center gap-1 mb-1.5">
                            <span className="text-[11px] font-bold px-2 py-0.5 rounded-lg bg-pink-100/90 text-pink-700">{item.type}</span>
                            {(item.statuses || []).map(st => {
                              const conf = STATUS_OPTIONS.find(s => s.label === st);
                              return <span key={st} className={`text-[10px] font-semibold px-2 py-0.5 rounded-lg border ${conf ? conf.bg : 'bg-slate-100 text-slate-600'}`}>{st}</span>;
                            })}
                            {(item.count || 1) > 1 && <span className="text-[10px] font-bold px-1.5 py-0.5 rounded-md bg-slate-100 text-slate-600">×{item.count}</span>}
                          </div>
                          <h3 className="font-bold text-slate-800 text-sm mb-1">{item.name || '名称未設定'}</h3>
                          {itemChars.length > 0 && (
                            <div className="flex flex-wrap gap-1 mb-1.5">
                              {itemChars.map(c => <span key={c.id} className="text-[10px] bg-slate-50 border border-slate-200 text-slate-600 px-1.5 py-0.5 rounded">{c.name}</span>)}
                            </div>
                          )}
                          {item.memo && <p className="text-[11px] text-slate-500 bg-rose-50/40 p-1.5 rounded-lg whitespace-pre-wrap">{item.memo}</p>}
                        </div>
                        <div className="flex justify-end gap-2 pt-2 border-t border-rose-50 text-xs">
                          <button onClick={() => openEditGoods(item)} className="px-2.5 py-1 text-rose-500 font-medium hover:bg-rose-50 rounded-lg">編集</button>
                          <button onClick={() => handleDelete(item.id)} className="px-2.5 py-1 text-slate-400 font-medium hover:text-red-500 rounded-lg">削除</button>
                        </div>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          ) : (
            /* ================= 💖 求め絵柄一覧 ================= */
            <div className="space-y-4">
              {filteredList.length === 0 ? (
                <div className="text-center py-14 bg-white/70 border border-dashed border-pink-200 rounded-3xl p-6">
                  <div className="text-3xl mb-2">💖</div>
                  <p className="text-slate-500 font-medium text-xs">登録されている求め絵柄がありません</p>
                  <p className="text-[11px] text-pink-400 mt-1">右下の「＋」ボタンから求めている絵柄を登録してみましょう！</p>
                </div>
              ) : (
                filteredList.map(item => {
                  const prioConf = getPriorityConf(item.priority);
                  const itemChars = (item.characters || []).map(cid => CHARACTERS.find(c => c.id === cid)).filter(Boolean);

                  return (
                    <div key={item.id} className="bg-white rounded-3xl border-2 border-pink-100/90 shadow-md shadow-pink-100/40 overflow-hidden flex flex-col sm:flex-row">
                      {/* イラストエリア */}
                      <div

                      <div className="grid grid-cols-4 gap-2">
                        {PRIORITIES.map(p => {
                          const isSel = filterPriorities.includes(p.id);
                          return (
                            <button
                              key={p.id}
                              onClick={() => toggleArray(setFilterPriorities, p.id)}
                              className={`py-2 rounded-xl text-xs font-bold border transition-all ${
                                isSel ? p.color + ' ring-2' : 'bg-slate-50 text-slate-500'
                              }`}
                            >
                              {p.label}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  )}

                  {/* 在庫タブ限定：ステータス */}
                  {activeTab === 'inventory' && (
                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-2">ステータス</label>
                      <div className="flex flex-wrap gap-2">
                        {STATUS_OPTIONS.map(s => {
                          const isSel = filterStatuses.includes(s.label);
                          return <button key={s.label} onClick={() => toggleArray(setFilterStatuses, s.label)} className={`px-3 py-1.5 rounded-xl text-xs font-bold border ${isSel ? s.bg + ' ring-2' : 'bg-slate-50 text-slate-500'}`}>{s.label}</button>
                        })}
                      </div>
                    </div>
                  )}

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-2">グッズの種類</label>
                    <div className="flex flex-wrap gap-1.5">
                      {ITEM_TYPES.map(t => {
                        const isSel = filterTypes.includes(t);
                        return <button key={t} onClick={() => toggleArray(setFilterTypes, t)} className={`px-2.5 py-1 rounded-lg text-xs font-medium border ${isSel ? 'bg-pink-100 text-pink-700 border-pink-200' : 'bg-slate-50 text-slate-500'}`}>{t}</button>
                      })}
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-2">ユニット</label>
                    <div className="flex flex-wrap gap-1.5">
                      {UNITS.map(u => {
                        const isSel = filterUnits.includes(u.id);
                        return <button key={u.id} onClick={() => toggleArray(setFilterUnits, u.id)} className={`px-2.5 py-1.5 rounded-xl text-xs font-bold border ${isSel ? u.color + ' ring-2' : 'bg-slate-50 text-slate-500'}`}>{u.name}</button>
                      })}
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-2">キャラクター</label>
                    <div className="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto p-2 border border-rose-100 rounded-xl bg-slate-50/50">
                      {CHARACTERS.map(c => {
                        const isSel = filterCharacters.includes(c.id);
                        return <button key={c.id} onClick={() => toggleArray(setFilterCharacters, c.id)} className={`px-2 py-1 rounded-lg text-xs font-medium border ${isSel ? 'bg-purple-100 text-purple-700 border-purple-200' : 'bg-white text-slate-600'}`}>{c.name}</button>
                      })}
                    </div>
                  </div>
                </div>
                <div className="p-4 border-t border-rose-100 bg-slate-50/50 rounded-b-3xl">
                  <button onClick={() => setIsFilterOpen(false)} className="w-full py-3 bg-gradient-to-r from-pink-400 to-rose-400 text-white rounded-xl font-bold">結果を表示する</button>
                </div>
              </div>
            </div>
          )}

          {/* 画像拡大モーダル */}
          {previewImage && (
            <div className="fixed inset-0 bg-black/85 flex items-center justify-center z-50 p-4" onClick={() => setPreviewImage(null)}>
              <img src={previewImage} alt="拡大プレビュー" className="max-w-full max-h-[85vh] object-contain rounded-2xl shadow-2xl" />
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
