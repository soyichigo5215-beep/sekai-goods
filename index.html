<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>プロセカ グッズ＆求め管理</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="プロセカ管理">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#fdf2f8">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .bg-overlay {
      background-color: rgba(255, 241, 242, 0.7);
      min-height: 100vh;
    }
  </style>
</head>
<body class="text-slate-700 min-h-screen antialiased selection:bg-pink-200">
  <div id="root" class="bg-overlay pb-28"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- データ定義 ---
    const UNITS = [
      { id: 'vs', name: 'バーチャル・シンガー', color: 'bg-teal-50 text-teal-700 border-teal-200' },
      { id: 'ln', name: 'Leo/need', color: 'bg-sky-50 text-sky-700 border-sky-200' },
      { id: 'mmj', name: 'MORE MORE JUMP！', color: 'bg-lime-50 text-lime-700 border-lime-200' },
      { id: 'vbs', name: 'Vivid BAD SQUAD', color: 'bg-rose-50 text-rose-700 border-rose-200' },
      { id: 'wxs', name: 'ワンダーランズ×ショウタイム', color: 'bg-amber-50 text-amber-700 border-amber-200' },
      { id: 'niigo', name: '25時、ナイトコードで。', color: 'bg-purple-50 text-purple-700 border-purple-200' },
    ];

    const CHARACTERS = [
      { id: 'miku', name: '初音ミク', unit: 'vs' }, { id: 'rin', name: '鏡音リン', unit: 'vs' }, { id: 'len', name: '鏡音レン', unit: 'vs' }, { id: 'luka', name: '巡音ルカ', unit: 'vs' }, { id: 'meiko', name: 'MEIKO', unit: 'vs' }, { id: 'kaito', name: 'KAITO', unit: 'vs' },
      { id: 'ichika', name: '星乃一歌', unit: 'ln' }, { id: 'saki', name: '天馬咲希', unit: 'ln' }, { id: 'honami', name: '望月穂波', unit: 'ln' }, { id: 'shiho', name: '日野森志歩', unit: 'ln' },
      { id: 'minori', name: '花里みのり', unit: 'mmj' }, { id: 'haruka', name: '桐谷遥', unit: 'mmj' }, { id: 'airi', name: '桃井愛莉', unit: 'mmj' }, { id: 'shizuku', name: '日野森雫', unit: 'mmj' },
      { id: 'kohane', name: '小豆沢こはね', unit: 'vbs' }, { id: 'an', name: '白石杏', unit: 'vbs' }, { id: 'akito', name: '東雲彰人', unit: 'vbs' }, { id: 'toya', name: '青柳冬弥', unit: 'vbs' },
      { id: 'tsukasa', name: '天馬司', unit: 'wxs' }, { id: 'emu', name: '鳳えむ', unit: 'wxs' }, { id: 'nene', name: '草薙寧々', unit: 'wxs' }, { id: 'rui', name: '神代類', unit: 'wxs' },
      { id: 'kanade', name: '宵崎奏', unit: 'niigo' }, { id: 'mafuyu', name: '朝比奈まふゆ', unit: 'niigo' }, { id: 'ena', name: '東雲絵名', unit: 'niigo' }, { id: 'mizuki', name: '暁山瑞希', unit: 'niigo' },
    ];

    // グッズ種類（箔押し統合版）
    const ITEM_TYPES = [
      'エピカ', 'ぱしゃこれ', 'メモステ', '色紙', '缶バッジ',
      '特典', 'はぴこれ', 'アクリルスタンド', 'キーホルダー', 'クリアファイル', 'その他'
    ];

    // サブ属性（仕様）の選択肢
    const ITEM_SUB_OPTIONS = {
      'エピカ': ['特訓前', '特訓後', '箔押し', 'その他'],
      'メモステ': ['小', '大', '箔押し', 'その他'],
      'ぱしゃこれ': ['ノーマル', '箔押し'],
      '色紙': ['特訓前', '特訓後', 'その他'],
      '缶バッジ': ['特訓前', '特訓後', 'その他'],
    };

    const STATUS_OPTIONS = [
      { label: '譲', bg: 'bg-pink-100 text-pink-700 border-pink-200' },
      { label: '求', bg: 'bg-sky-100 text-sky-700 border-sky-200' },
      { label: '所持', bg: 'bg-emerald-100 text-emerald-700 border-emerald-200' },
      { label: '交換予定', bg: 'bg-amber-100 text-amber-700 border-amber-200' },
      { label: '譲渡予定', bg: 'bg-indigo-100 text-indigo-700 border-indigo-200' },
      { label: '予約済', bg: 'bg-teal-100 text-teal-700 border-teal-200' },
      { label: '保留', bg: 'bg-purple-100 text-purple-700 border-purple-200' },
    ];

    const normalizeStatus = (st) => (st === '交換中' ? '交換予定' : st);

    const PRIORITIES = [
      { id: '最優先', label: '最優先', color: 'bg-rose-500 text-white shadow-sm shadow-rose-200' },
      { id: '優先', label: '優先', color: 'bg-pink-400 text-white shadow-sm shadow-pink-200' },
      { id: '求', label: '求', color: 'bg-sky-400 text-white shadow-sm shadow-sky-200' },
      { id: '緩求', label: '緩求', color: 'bg-slate-400 text-white' },
    ];

    const RATES = [
      { id: '激高', label: '激高', color: 'bg-rose-600 text-white', border: 'border-rose-400' },
      { id: '高', label: '高', color: 'bg-amber-500 text-white', border: 'border-amber-400' },
      { id: '普通', label: '普通', color: 'bg-emerald-500 text-white', border: 'border-emerald-400' },
      { id: '低', label: '低', color: 'bg-sky-400 text-white', border: 'border-sky-300' },
      { id: '激低', label: '激低', color: 'bg-slate-400 text-white', border: 'border-slate-300' },
    ];

    const FILTER_RATES = [
      ...RATES,
      { id: '未設定', label: '未設定', color: 'bg-slate-200 text-slate-700', border: 'border-slate-300' },
    ];

    const getPriorityConf = (prio) => {
      if (typeof prio === 'number') {
        if (prio >= 5) return PRIORITIES[0];
        if (prio === 4) return PRIORITIES[1];
        if (prio === 3) return PRIORITIES[2];
        return PRIORITIES[3];
      }
      return PRIORITIES.find(p => p.id === prio) || PRIORITIES[0];
    };

    // グッズ名とサブ属性の表示フォーマット関数
    const formatTypeBadge = (type, subTypes) => {
      if (!subTypes || subTypes.length === 0) return type;
      return `${type}:${subTypes.join(' ')}`;
    };

    // 既存データの正規化（過去の「エピカ(箔押し)」等との互換性）
    const normalizeItemData = (item) => {
      let type = item.type;
      let subTypes = Array.isArray(item.subTypes) ? [...item.subTypes] : [];
      if (type === 'エピカ(箔押し)') {
        type = 'エピカ';
        if (!subTypes.includes('箔押し')) subTypes.push('箔押し');
      }
      if (type === 'メモステ(箔押し)') {
        type = 'メモステ';
        if (!subTypes.includes('箔押し')) subTypes.push('箔押し');
      }

      let types = Array.isArray(item.types) ? [...item.types] : [];
      let typeSubMap = item.typeSubMap ? { ...item.typeSubMap } : {};
      types = types.map(t => {
        if (t === 'エピカ(箔押し)') {
          if (!typeSubMap['エピカ']) typeSubMap['エピカ'] = [];
          if (!typeSubMap['エピカ'].includes('箔押し')) typeSubMap['エピカ'].push('箔押し');
          return 'エピカ';
        }
        if (t === 'メモステ(箔押し)') {
          if (!typeSubMap['メモステ']) typeSubMap['メモステ'] = [];
          if (!typeSubMap['メモステ'].includes('箔押し')) typeSubMap['メモステ'].push('箔押し');
          return 'メモステ';
        }
        return t;
      });
      types = Array.from(new Set(types));

      return {
        ...item,
        type,
        subTypes,
        types,
        typeSubMap,
        statuses: (item.statuses || []).map(normalizeStatus)
      };
    };

    // --- DB処理 ---
    const DB_NAME = 'SekaiGoodsStorage';
    const DB_STORE = 'goods';
    const openDB = () => new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(DB_STORE, { keyPath: 'id' });
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });

    const loadAllItems = async () => {
      try {
        const db = await openDB();
        return new Promise(resolve => {
          const req = db.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).getAll();
          req.onsuccess = () => {
            const raw = req.result || [];
            resolve(raw.map(normalizeItemData));
          };
          req.onerror = () => resolve([]);
        });
      } catch (e) { return []; }
    };

    const saveItemDB = async (item) => {
      const db = await openDB();
      db.transaction(DB_STORE, 'readwrite').objectStore(DB_STORE).put(item);
    };
    const deleteItemDB = async (id) => {
      const db = await openDB();
      db.transaction(DB_STORE, 'readwrite').objectStore(DB_STORE).delete(id);
    };

    // --- 初期フォーム状態 ---
    const initialGoodsForm = {
      id: '', isWanted: false, name: '', type: 'エピカ', subTypes: ['特訓前'],
      units: [], characters: [], statuses: ['譲'], count: 1, rate: '', memo: '', image: '', createdAt: 0
    };
    const initialWantedForm = {
      id: '', isWanted: true, name: '', types: ['エピカ'], typeSubMap: { 'エピカ': ['特訓前'] },
      units: [], characters: [], priority: '最優先', count: '1', memo: '', image: '', createdAt: 0
    };

    function App() {
      const [items, setItems] = useState([]);
      const [activeTab, setActiveTab] = useState('inventory');
      
      const [isGoodsModalOpen, setIsGoodsModalOpen] = useState(false);
      const [isWantedModalOpen, setIsWantedModalOpen] = useState(false);
      const [isFilterOpen, setIsFilterOpen] = useState(false);
      const [previewImage, setPreviewImage] = useState(null);

      const [sortBy, setSortBy] = useState('registered');
      const [showRateComparison, setShowRateComparison] = useState(false);

      const [goodsForm, setGoodsForm] = useState(initialGoodsForm);
      const [wantedForm, setWantedForm] = useState(initialWantedForm);

      // トリミングモーダル
      const [cropModalOpen, setCropModalOpen] = useState(false);
      const [cropTarget, setCropTarget] = useState('goods');
      const [rawImageSrc, setRawImageSrc] = useState(null);
      const [cropAspect, setCropAspect] = useState('square');
      const [cropZoom, setCropZoom] = useState(1.0);
      const [cropPosX, setCropPosX] = useState(50);
      const [cropPosY, setCropPosY] = useState(50);
      const canvasRef = useRef(null);
      const rawImageRef = useRef(null);

      // 検索・絞り込み状態
      const [searchTerm, setSearchTerm] = useState('');
      const [filterTypes, setFilterTypes] = useState([]);
      const [filterSubTypes, setFilterSubTypes] = useState({}); // { [type]: ['特訓前', ...] }
      const [filterUnits, setFilterUnits] = useState([]);
      const [filterCharacters, setFilterCharacters] = useState([]);
      const [filterStatuses, setFilterStatuses] = useState([]);
      const [filterRates, setFilterRates] = useState([]);
      const [filterPriorities, setFilterPriorities] = useState([]);

      const goodsFileInputRef = useRef(null);
      const wantedFileInputRef = useRef(null);

      useEffect(() => { loadAllItems().then(setItems); }, []);

      const inventoryItems = useMemo(() => items.filter(i => !i.isWanted), [items]);
      const wantedItems = useMemo(() => items.filter(i => i.isWanted), [items]);

      const openAddGoods = () => {
        setGoodsForm({ ...initialGoodsForm, id: 'goods_' + Date.now(), createdAt: Date.now() });
        setIsGoodsModalOpen(true);
      };
      const openEditGoods = (item) => {
        const normalized = normalizeItemData(item);
        setGoodsForm({
          id: normalized.id, isWanted: false, name: normalized.name || '', type: normalized.type || 'エピカ',
          subTypes: normalized.subTypes && normalized.subTypes.length > 0 ? normalized.subTypes : (ITEM_SUB_OPTIONS[normalized.type] ? [ITEM_SUB_OPTIONS[normalized.type][0]] : []),
          units: normalized.units || [], characters: normalized.characters || [], statuses: normalized.statuses || ['譲'],
          count: normalized.count || 1, rate: normalized.rate || '', memo: normalized.memo || '', image: normalized.image || '',
          createdAt: normalized.createdAt || 0
        });
        setIsGoodsModalOpen(true);
      };

      const openAddWanted = () => {
        setWantedForm({ ...initialWantedForm, id: 'wanted_' + Date.now(), createdAt: Date.now() });
        setIsWantedModalOpen(true);
      };
      const openEditWanted = (item) => {
        const normalized = normalizeItemData(item);
        setWantedForm({
          id: normalized.id, isWanted: true, name: normalized.name || '', types: normalized.types || ['エピカ'],
          typeSubMap: normalized.typeSubMap || {},
          units: normalized.units || [], characters: normalized.characters || [],
          priority: getPriorityConf(normalized.priority).id,
          count: normalized.count !== undefined ? String(normalized.count) : '1',
          memo: normalized.memo || '', image: normalized.image || '',
          createdAt: normalized.createdAt || 0
        });
        setIsWantedModalOpen(true);
      };

      // 保存処理（所属ユニットの自動登録を含む）
      const handleSave = async (dataToSave, closeModal) => {
        // バリデーション：サブ属性の必須チェック
        if (!dataToSave.isWanted) {
          if (ITEM_SUB_OPTIONS[dataToSave.type]) {
            if (!dataToSave.subTypes || dataToSave.subTypes.length === 0) {
              alert(`「${dataToSave.type}」の仕様（${ITEM_SUB_OPTIONS[dataToSave.type].join(' / ')}）を1つ以上選択してください`);
              return;
            }
          }
        } else {
          for (const t of (dataToSave.types || [])) {
            if (ITEM_SUB_OPTIONS[t]) {
              const subs = dataToSave.typeSubMap?.[t] || [];
              if (subs.length === 0) {
                alert(`「${t}」の仕様（${ITEM_SUB_OPTIONS[t].join(' / ')}）を1つ以上選択してください`);
                return;
              }
            }
          }
        }

        // キャラクターの所属ユニットを自動補完
        const autoUnits = new Set(dataToSave.units || []);
        (dataToSave.characters || []).forEach(cid => {
          const c = CHARACTERS.find(x => x.id === cid);
          if (c && c.unit) autoUnits.add(c.unit);
        });

        const finalItem = {
          ...dataToSave,
          units: Array.from(autoUnits),
          createdAt: dataToSave.createdAt || Date.now()
        };

        await saveItemDB(finalItem);
        setItems(prev => {
          const idx = prev.findIndex(i => i.id === finalItem.id);
          return idx >= 0 ? [...prev.slice(0,idx), finalItem, ...prev.slice(idx+1)] : [finalItem, ...prev];
        });
        closeModal();
      };

      const handleDelete = async (id) => {
        if (!confirm('削除してよろしいですか？')) return;
        await deleteItemDB(id);
        setItems(prev => prev.filter(i => i.id !== id));
      };

      // キャラクター選択（ユニットを自動選択せず、純粋にキャラのみトグル）
      const handleToggleCharacter = (formSetter, charId) => {
        formSetter(prev => {
          const currChars = prev.characters || [];
          const isSelected = currChars.includes(charId);
          const nextChars = isSelected ? currChars.filter(x => x !== charId) : [...currChars, charId];
          return { ...prev, characters: nextChars };
        });
      };

      // 画像トリミング
      const handleImageSelect = (e, target) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          setCropTarget(target);
          setRawImageSrc(evt.target.result);
          setCropZoom(1.0);
          setCropPosX(50);
          setCropPosY(50);
          setCropModalOpen(true);
        };
        reader.readAsDataURL(file);
      };

      useEffect(() => {
        if (!cropModalOpen || !rawImageSrc || !canvasRef.current) return;
        const img = new Image();
        img.src = rawImageSrc;
        rawImageRef.current = img;
        img.onload = () => drawCropPreview();
      }, [cropModalOpen, rawImageSrc, cropAspect, cropZoom, cropPosX, cropPosY]);

      const getAspectDimensions = (aspect) => {
        if (aspect === 'landscape') return { w: 600, h: 450 };
        if (aspect === 'portrait') return { w: 450, h: 600 };
        return { w: 500, h: 500 };
      };

      const drawCropPreview = () => {
        const canvas = canvasRef.current;
        const img = rawImageRef.current;
        if (!canvas || !img) return;
        const ctx = canvas.getContext('2d');
        const { w: outW, h: outH } = getAspectDimensions(cropAspect);
        canvas.width = outW;
        canvas.height = outH;

        const targetRatio = outW / outH;
        const imgRatio = img.width / img.height;

        let baseCropW, baseCropH;
        if (imgRatio > targetRatio) {
          baseCropH = img.height;
          baseCropW = img.height * targetRatio;
        } else {
          baseCropW = img.width;
          baseCropH = img.width / targetRatio;
        }

        const cropW = baseCropW / cropZoom;
        const cropH = baseCropH / cropZoom;
        const maxOffsetX = img.width - cropW;
        const maxOffsetY = img.height - cropH;

        const sourceX = Math.max(0, Math.min(img.width - cropW, maxOffsetX * (cropPosX / 100)));
        const sourceY = Math.max(0, Math.min(img.height - cropH, maxOffsetY * (cropPosY / 100)));

        ctx.clearRect(0, 0, outW, outH);
        ctx.drawImage(img, sourceX, sourceY, cropW, cropH, 0, 0, outW, outH);
      };

      const confirmCrop = () => {
        if (!canvasRef.current) return;
        const croppedBase64 = canvasRef.current.toDataURL('image/jpeg', 0.85);
        if (cropTarget === 'goods') {
          setGoodsForm(p => ({ ...p, image: croppedBase64 }));
        } else {
          setWantedForm(p => ({ ...p, image: croppedBase64 }));
        }
        setCropModalOpen(false);
      };

      const toggleArray = (setter, value) => {
        setter(prev => prev.includes(value) ? prev.filter(v => v !== value) : [...prev, value]);
      };

      // 絞り込み用サブ属性トグル
      const toggleFilterSubType = (parentType, subVal) => {
        setFilterSubTypes(prev => {
          const currentList = prev[parentType] || [];
          const nextList = currentList.includes(subVal)
            ? currentList.filter(x => x !== subVal)
            : [...currentList, subVal];
          return { ...prev, [parentType]: nextList };
        });
      };

      // ソート順序
      const charOrderMap = useMemo(() => {
        const map = {};
        CHARACTERS.forEach((c, idx) => { map[c.id] = idx; });
        return map;
      }, []);

      const typeOrderMap = useMemo(() => {
        const map = {};
        ITEM_TYPES.forEach((t, idx) => { map[t] = idx; });
        return map;
      }, []);

      const getItemCharRank = (item) => {
        if (!item.characters || item.characters.length === 0) return 999;
        const ranks = item.characters.map(cid => charOrderMap[cid] ?? 998);
        return Math.min(...ranks);
      };

      const getItemTypeRank = (item) => {
        if (item.isWanted) {
          if (!item.types || item.types.length === 0) return 999;
          const ranks = item.types.map(t => typeOrderMap[t] ?? 998);
          return Math.min(...ranks);
        }
        return typeOrderMap[item.type] ?? 999;
      };

      const getItemTimeRank = (item) => {
        if (item.createdAt) return item.createdAt;
        const match = (item.id || '').match(/\d+/);
        return match ? parseInt(match[0]) : 0;
      };

      const activeList = activeTab === 'inventory' ? inventoryItems : wantedItems;

      // フィルタリング & ソート
      const sortedAndFilteredList = useMemo(() => {
        const filtered = activeList.filter(item => {
          const name = item.name || '';
          const memo = item.memo || '';
          const chars = (item.characters || []).map(cid => CHARACTERS.find(c => c.id === cid)?.name || '').join(' ');
          const searchMatch = !searchTerm || (name + ' ' + memo + ' ' + chars).toLowerCase().includes(searchTerm.toLowerCase());

          // グッズ種別 & サブ属性の合致判定
          let typeMatch = true;
          if (filterTypes.length > 0) {
            if (!item.isWanted) {
              if (!filterTypes.includes(item.type)) {
                typeMatch = false;
              } else {
                // サブ属性フィルターがある場合
                const targetSubs = filterSubTypes[item.type] || [];
                if (targetSubs.length > 0) {
                  typeMatch = (item.subTypes || []).some(s => targetSubs.includes(s));
                }
              }
            } else {
              // 求め絵柄
              const matchedTypes = (item.types || []).filter(t => filterTypes.includes(t));
              if (matchedTypes.length === 0) {
                typeMatch = false;
              } else {
                // サブ属性フィルターがあるか確認
                typeMatch = matchedTypes.some(t => {
                  const targetSubs = filterSubTypes[t] || [];
                  if (targetSubs.length === 0) return true; // 未選択なら全仕様OK
                  const itemSubs = item.typeSubMap?.[t] || [];
                  return itemSubs.some(s => targetSubs.includes(s));
                });
              }
            }
          }

          const unitMatch = filterUnits.length === 0 || (item.units || []).some(u => filterUnits.includes(u));
          const charMatch = filterCharacters.length === 0 || (item.characters || []).some(c => filterCharacters.includes(c));
          
          let statusMatch = true;
          let rateMatch = true;
          if (!item.isWanted) {
            if (filterStatuses.length > 0) {
              const itemStatuses = (item.statuses || []).map(normalizeStatus);
              statusMatch = itemStatuses.some(s => filterStatuses.includes(s));
            }
            if (filterRates.length > 0) {
              const isUnset = !item.rate || item.rate === '';
              rateMatch = (filterRates.includes('未設定') && isUnset) || (!isUnset && filterRates.includes(item.rate));
            }
          }

          let priorityMatch = true;
          if (item.isWanted && filterPriorities.length > 0) {
            const currentPrio = getPriorityConf(item.priority).id;
            priorityMatch = filterPriorities.includes(currentPrio);
          }

          return searchMatch && typeMatch && unitMatch && charMatch && statusMatch && rateMatch && priorityMatch;
        });

        return filtered.sort((a, b) => {
          if (sortBy === 'character') {
            const charDiff = getItemCharRank(a) - getItemCharRank(b);
            if (charDiff !== 0) return charDiff;
            const typeDiff = getItemTypeRank(a) - getItemTypeRank(b);
            if (typeDiff !== 0) return typeDiff;
            return getItemTimeRank(b) - getItemTimeRank(a);
          } else if (sortBy === 'type') {
            const typeDiff = getItemTypeRank(a) - getItemTypeRank(b);
            if (typeDiff !== 0) return typeDiff;
            const charDiff = getItemCharRank(a) - getItemCharRank(b);
            if (charDiff !== 0) return charDiff;
            return getItemTimeRank(b) - getItemTimeRank(a);
          } else {
            return getItemTimeRank(b) - getItemTimeRank(a);
          }
        });
      }, [activeList, searchTerm, filterTypes, filterSubTypes, filterUnits, filterCharacters, filterStatuses, filterRates, filterPriorities, sortBy]);

      const subTypeFilterCount = Object.values(filterSubTypes).reduce((acc, cur) => acc + cur.length, 0);
      const activeFilterCount = filterTypes.length + subTypeFilterCount + filterUnits.length + filterCharacters.length + (activeTab === 'inventory' ? (filterStatuses.length + filterRates.length) : filterPriorities.length);

      // モーダル内で選択中ユニットに連動したキャラクター候補
      const availableCharactersFilter = useMemo(() => {
        if (filterUnits.length === 0) return CHARACTERS;
        return CHARACTERS.filter(c => filterUnits.includes(c.unit));
      }, [filterUnits]);

      const availableCharactersGoodsForm = useMemo(() => {
        if (!goodsForm.units || goodsForm.units.length === 0) return CHARACTERS;
        return CHARACTERS.filter(c => goodsForm.units.includes(c.unit));
      }, [goodsForm.units]);

      const availableCharactersWantedForm = useMemo(() => {
        if (!wantedForm.units || wantedForm.units.length === 0) return CHARACTERS;
        return CHARACTERS.filter(c => wantedForm.units.includes(c.unit));

      return (
        <div className="max-w-4xl mx-auto px-2.5 sm:px-4 py-4">
          {/* ヘッダー */}

              プロセカ グッズ管理

            <p className="text-[11px] text-rose-400">グッズ在庫 & 求め絵柄コレクション</p>
          </header>

          {/* メインタブ切り替え */}
          <div className="flex bg-rose-100/60 p-1 rounded-2xl mb-3 shadow-inner">
            <button
              onClick={() => { setActiveTab('inventory'); setSearchTerm(''); }}
              className={`flex-1 py-2 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 transition-all ${
                activeTab === 'inventory' ? 'bg-white text-rose-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'

            >
              <span>📦</span> 在庫・所持
              <span className="text-[10px] px-1.5 py-0.2 bg-rose-50 text-rose-500 rounded-full">{inventoryItems.length}</span>
            </button>
            <button

            >
              <span>💖</span> 求め絵柄

            </button>
          </div>

          <section className="bg-white/95 p-2.5 rounded-2xl shadow-sm border border-rose-100 mb-2.5 flex gap-2">

              onChange={e => setSearchTerm(e.target.value)}
              className="flex-1 px-3 py-1.5 rounded-xl border border-rose-200 bg-rose-50/20 text-xs focus:outline-none focus:ring-2 focus:ring-rose-300"
            />
            <button

              className="px-3 py-1.5 bg-rose-50 text-rose-600 border border-rose-200 rounded-xl text-xs font-bold flex items-center gap-1 relative"
            >
              絞り込み
              {activeFilterCount > 0 && (
                <span className="absolute -top-1.5 -right-1.5 bg-pink-500 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center">
                  {activeFilterCount}
                </span>

            </button>
          </section>

          {/* コントロール行 */}
          <div className="flex flex-wrap items-center justify-between gap-2 mb-3 px-1">
            <div className="flex items-center gap-1.5 text-xs text-slate-500 font-bold">
              <span>⇅ 並び順:</span>
              <div className="flex bg-white/90 p-0.5 rounded-xl border border-rose-100 shadow-sm">
                {[
                  { id: 'registered', label: '登録順' },
                  { id: 'character', label: 'キャラ順' },
                  { id: 'type', label: 'グッズ順' },
                ].map(s => (
                  <button
                    key={s.id}
                    onClick={() => setSortBy(s.id)}
                    className={`px-2 py-1 rounded-lg text-[11px] font-bold transition-all ${
                      sortBy === s.id ? 'bg-rose-400 text-white shadow-xs' : 'text-slate-500 hover:text-slate-800'
                    }`}
                  >
                    {s.label}
                  </button>
                ))}
              </div>
            </div>

            <div className="flex items-center gap-2">
              {activeTab === 'inventory' && (
                <button
                  type="button"
                  onClick={() => setShowRateComparison(prev => !prev)}
                  className={`px-2.5 py-1 rounded-xl text-[11px] font-bold border transition-all flex items-center gap-1 shadow-xs ${
                    showRateComparison
                      ? 'bg-gradient-to-r from-purple-500 to-indigo-500 text-white border-purple-400 ring-2 ring-purple-200'
                      : 'bg-white/95 text-slate-500 border-rose-200 hover:bg-rose-50'

                const itemChars = (item.characters || []).map(cid => CHARACTERS.find(c => c.id === cid)).filter(Boolean);

                if (!item.isWanted) {

                  const typeLabel = formatTypeBadge(item.type, item.subTypes);

                  return (
                    <div
                      key={item.id}
                      className="break-inside-avoid bg-white rounded-xl border border-rose-100 shadow-sm overflow-hidden flex flex-col group relative"
                    >

                        {(item.count || 1) > 1 && (

                            <div className="flex flex-wrap gap-0.5 mb-1">
                              {itemChars.map(c => (
                                <span key={c.id} className="text-[8px] bg-slate-50 text-slate-500 border border-slate-100 px-1 rounded truncate">
                                  {c.name}
                                </span>
                              ))}
                            </div>

                        </div>

                        <div className="flex justify-end gap-1 pt-1 border-t border-rose-50/80 text-[10px]">
                          <button onClick={() => openEditGoods(item)} className="text-rose-500 hover:underline font-bold px-1 py-0.5">編集</button>
                          <button onClick={() => handleDelete(item.id)} className="text-slate-400 hover:text-red-500 font-medium px-1 py-0.5">削除</button>
                        </div>
                      </div>
                    </div>
                  );
                } else {
                  /* ================= 💖 求め絵柄 ミニカード ================= */
                  const prioConf = getPriorityConf(item.priority);
                  return (
                    <div
                      key={item.id}
                      className="break-inside-avoid bg-white rounded-xl border border-pink-200 shadow-sm overflow-hidden flex flex-col group relative"
                    >
                      <div 
                        className="w-full bg-slate-50 relative cursor-pointer"
                        onClick={() => item.image && setPreviewImage(item.image)}
                      >
                        {item.image ? (
                          <img src={item.image} alt={item.name} className="w-full h-auto object-contain block" />
                        ) : (
                          <div className="w-full aspect-square bg-pink-50/50 flex items-center justify-center text-pink-300 text-lg">🖼️</div>
                        )}
                        <div className="absolute top-1 left-1">
                          <span className={`text-[8px] font-black px-1.5 py-0.2 rounded-md shadow-xs ${prioConf.color}`}>
                            {prioConf.label}
                          </span>
                        </div>
                        {/* 求め希望数（少数・∞など）の表示 */}
                        {item.count && (
                          <span className="absolute top-1 right-1 text-[9px] font-black px-1.5 py-0.2 rounded-md bg-black/60 text-white">
                            ×{item.count}
                          </span>
                        )}
                      </div>

                      <div className="p-1.5 flex flex-col justify-between flex-1 bg-white">
                        <div>
                          {/* 求めているグッズ種別（仕様付きで表示） */}
                          <div className="flex flex-wrap gap-0.5 mb-1">
                            {(item.types && item.types.length > 0) ? (
                              item.types.map(t => {
                                const subs = item.typeSubMap?.[t] || [];
                                const badge = formatTypeBadge(t, subs);
                                return (
                                  <span key={t} className="text-[8px] font-bold px-1 py-0.2 rounded bg-rose-50 text-rose-600 border border-rose-100 max-w-full truncate" title={badge}>

                            <div className="flex flex-wrap gap-0.5 mb-1">
                              {itemChars.map(c => (
                                <span key={c.id} className="text-[8px] bg-slate-50 text-slate-500 border border-slate-100 px-1 rounded truncate">
                                  {c.name}
                                </span>
                              ))}

                          )}
                        </div>

                        <div className="flex justify-end gap-1 pt-1 border-t border-pink-50 text-[10px]">
                          <button onClick={() => openEditWanted(item)} className="text-pink-600 hover:underline font-bold px-1 py-0.5">編集</button>
                          <button onClick={() => handleDelete(item.id)} className="text-slate-400 hover:text-red-500 font-medium px-1 py-0.5">削除</button>
                        </div>
                      </div>
                    </div>
                  );
                }
              })}
            </div>
          )}

          {/* フローティング追加ボタン */}
          <button
            onClick={activeTab === 'inventory' ? openAddGoods : openAddWanted}
            className="fixed bottom-6 right-6 w-14 h-14 bg-gradient-to-tr from-pink-400 to-rose-400 text-white rounded-full shadow-lg shadow-pink-300/60 flex items-center justify-center text-3xl font-light hover:scale-105 active:scale-95 transition-all z-20"
          >
            ＋
          </button>

          {/* ================= 📦 在庫グッズ 登録モーダル ================= */}

            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-end sm:items-center justify-center z-30 p-0 sm:p-4">
              <div className="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[90vh] flex flex-col shadow-2xl animate-in slide-in-from-bottom duration-200">
                <div className="px-5 py-3.5 border-b border-rose-100 flex items-center justify-between">
                  <h2 className="text-base font-bold text-slate-800">{goodsForm.name ? 'グッズの編集' : '新しいグッズを登録'}</h2>
                  <button onClick={() => setIsGoodsModalOpen(false)} className="w-8 h-8 rounded-full bg-slate-100 text-slate-400">✕</button>
                </div>
                <form onSubmit={(e) => { e.preventDefault(); handleSave(goodsForm, () => setIsGoodsModalOpen(false)); }} className="p-4 overflow-y-auto space-y-3.5 text-xs hide-scrollbar">

                      </div>
                    ) : (

                        setGoodsForm(p => ({ ...p, type: nextType, subTypes: defaultSubs }));

                      className="w-full px-3 py-2 rounded-xl border border-rose-200 bg-white"

                    </select>

                  {/* ユニット選択（キャラを絞る用） */}
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">
                      ユニット <span className="text-[10px] font-normal text-slate-400">（選ぶと下のキャラが絞り込まれます）</span>
                    </label>
                    <div className="flex flex-wrap gap-1.5">
                      {UNITS.map(u => {
                        const isSel = (goodsForm.units || []).includes(u.id);
                        return <button type="button" key={u.id} onClick={() => {
                          const curr = goodsForm.units || [];
                          setGoodsForm(p => ({ ...p, units: isSel ? curr.filter(x => x !== u.id) : [...curr, u.id] }));
                        }} className={`px-2.5 py-1 rounded-xl text-xs font-semibold border ${isSel ? u.color + ' ring-2' : 'bg-slate-50 text-slate-500'}`}>{isSel ? '✓ ' : ''}{u.name}</button>
                      })}
                    </div>
                  </div>

                  {/* キャラクター選択（ユニットを自動選択せず、保存時に所属ユニットを自動補完） */}
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">
                      キャラクター（複数可）
                    </label>
                    <div className="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto p-1.5 border border-rose-100 rounded-xl bg-slate-50/50">
                      {availableCharactersGoodsForm.map(c => {
                        const isSel = (goodsForm.characters || []).includes(c.id);
                        return (
                          <button
                            type="button"
                            key={c.id}
                            onClick={() => handleToggleCharacter(setGoodsForm, c.id)}
                            className={`px-2 py-1 rounded-lg text-xs font-medium border ${isSel ? 'bg-pink-400 text-white shadow-xs' : 'bg-white text-slate-600'}`}
                          >
                            {isSel ? '✓ ' : ''}{c.name}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">メモ</label>
                    <textarea rows="2" placeholder="@twitter_id 様と交換予定" value={goodsForm.memo} onChange={e => setGoodsForm(p => ({ ...p, memo: e.target.value }))} className="w-full px-3 py-1.5 rounded-xl border border-rose-200 text-xs" />
                  </div>
                  <div className="pt-1">
                    <button type="submit" className="w-full py-3 bg-gradient-to-r from-pink-400 to-rose-400 text-white rounded-2xl font-bold shadow-md">保存する</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ================= 💖 求め絵柄 登録モーダル ================= */}
          {isWantedModalOpen && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-end sm:items-center justify-center z-30 p-0 sm:p-4">
              <div className="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[90vh] flex flex-col shadow-2xl animate-in slide-in-from-bottom duration-200">
                <div className="px-5 py-3.5 border-b border-pink-100 flex items-center justify-between">
                  <h2 className="text-base font-bold text-slate-800">{wantedForm.name ? '求め絵柄の編集' : '新しい求め絵柄を登録'}</h2>
                  <button onClick={() => setIsWantedModalOpen(false)} className="w-8 h-8 rounded-full bg-slate-100 text-slate-400">✕</button>
                </div>
                <form onSubmit={(e) => { e.preventDefault(); handleSave(wantedForm, () => setIsWantedModalOpen(false)); }} className="p-4 overflow-y-auto space-y-3.5 text-xs hide-scrollbar">
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">イラスト画像（トリミング可）</label>
                    <input type="file" accept="image/*" ref={wantedFileInputRef} onChange={(e) => handleImageSelect(e, 'wanted')} className="hidden" />
                    {wantedForm.image ? (
                      <div className="relative rounded-2xl overflow-hidden border-2 border-pink-200 h-40 bg-slate-50 flex items-center justify-center">
                        <img src={wantedForm.image} className="w-full h-full object-contain" />
                        <div className="absolute top-2 right-2 flex gap-1">
                          <button type="button" onClick={() => wantedFileInputRef.current?.click()} className="bg-black/60 text-white text-[10px] px-2 py-1 rounded-full">変更</button>
                          <button type="button" onClick={() => setWantedForm(p => ({ ...p, image: '' }))} className="bg-red-500/80 text-white text-[10px] px-2 py-1 rounded-full">削除</button>
                        </div>
                      </div>
                    ) : (
                      <button type="button" onClick={() => wantedFileInputRef.current?.click()} className="w-full h-24 border-2 border-dashed border-pink-300 rounded-2xl flex flex-col items-center justify-center bg-pink-50/30 text-pink-500">
                        <span className="text-xl mb-1">✂️</span><span className="text-xs font-bold">イラストを選択してトリミング</span>
                      </button>
                    )}
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">優先度</label>
                    <div className="grid grid-cols-4 gap-1.5">
                      {PRIORITIES.map(p => {
                        const isSel = wantedForm.priority === p.id;
                        return (
                          <button
                            type="button"
                            key={p.id}
                            onClick={() => setWantedForm(prev => ({ ...prev, priority: p.id }))}
                            className={`py-2 rounded-xl text-xs font-bold border ${isSel ? p.color + ' ring-2 ring-pink-300' : 'bg-slate-50 text-slate-600'}`}
                          >
                            {p.label}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* 求めているグッズの種類 & サブ属性 */}
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">求めているグッズの種類（複数可）</label>
                    <div className="flex flex-wrap gap-1.5 mb-2">
                      {ITEM_TYPES.map(t => {
                        const isSel = (wantedForm.types || []).includes(t);
                        return (
                          <button
                            type="button"
                            key={t}
                            onClick={() => {
                              const curr = wantedForm.types || [];
                              const nextTypes = isSel ? curr.filter(x => x !== t) : [...curr, t];
                              // 新規追加時、サブ属性があればデフォルトで1つ目を選択
                              const nextSubMap = { ...(wantedForm.typeSubMap || {}) };
                              if (!isSel && ITEM_SUB_OPTIONS[t] && (!nextSubMap[t] || nextSubMap[t].length === 0)) {
                                nextSubMap[t] = [ITEM_SUB_OPTIONS[t][0]];
                              }
                              setWantedForm(p => ({ ...p, types: nextTypes, typeSubMap: nextSubMap }));
                            }}
                            className={`px-2.5 py-1 rounded-xl text-xs font-semibold border ${isSel ? 'bg-rose-500 text-white border-rose-500 shadow-xs' : 'bg-slate-50 text-slate-600'}`}
                          >
                            {isSel ? '✓ ' : ''}{t}
                          </button>
                        );
                      })}
                    </div>

                    {/* 選択されたグッズの仕様設定（サブ属性があるもののみ展開） */}
                    {(wantedForm.types || []).filter(t => ITEM_SUB_OPTIONS[t]).map(t => (
                      <div key={t} className="bg-pink-50/50 p-2 rounded-xl border border-pink-100 mb-1.5">
                        <span className="text-[11px] font-bold text-pink-600 block mb-1">
                          {t}の仕様 <span className="text-[9px] font-normal text-pink-400">（1つ以上選択必須）</span>
                        </span>
                        <div className="flex flex-wrap gap-1">
                          {ITEM_SUB_OPTIONS[t].map(sub => {
                            const subs = wantedForm.typeSubMap?.[t] || [];
                            const isSubSel = subs.includes(sub);
                            return (
                              <button
                                type="button"
                                key={sub}
                                onClick={() => {
                                  const nextSubs = isSubSel ? subs.filter(x => x !== sub) : [...subs, sub];
                                  setWantedForm(p => ({
                                    ...p,
                                    typeSubMap: { ...(p.typeSubMap || {}), [t]: nextSubs }
                                  }));
                                }}
                                className={`px-2 py-0.5 rounded-lg text-xs font-bold border transition-all ${
                                  isSubSel ? 'bg-rose-500 text-white border-rose-500' : 'bg-white text-slate-600 border-slate-200'
                                }`}
                              >
                                {isSubSel ? '✓ ' : ''}{sub}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    ))}
                  </div>

                  {/* 絵柄名 & 希望数（少数、∞対応） */}
                  <div className="grid grid-cols-3 gap-2">
                    <div className="col-span-2">
                      <label className="block text-xs font-bold text-slate-600 mb-1">絵柄名・カード名</label>
                      <input type="text" placeholder="例：特訓後「導きの乙女」" value={wantedForm.name} onChange={e => setWantedForm(p => ({ ...p, name: e.target.value }))} className="w-full px-3 py-2 rounded-xl border border-pink-200 bg-white" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">希望個数</label>
                      <input
                        type="text"
                        placeholder="例: 1, 少数, ∞"
                        value={wantedForm.count || ''}
                        onChange={e => setWantedForm(p => ({ ...p, count: e.target.value }))}
                        className="w-full px-2 py-2 rounded-xl border border-pink-200 bg-white text-center text-xs"
                      />
                    </div>
                  </div>

                  {/* 希望数のクイック入力ボタン */}
                  <div className="flex items-center gap-1.5 justify-end">
                    <span className="text-[10px] text-slate-400">クイック入力:</span>
                    {['1', '2', '少数', '∞'].map(val => (
                      <button
                        type="button"
                        key={val}
                        onClick={() => setWantedForm(p => ({ ...p, count: val }))}
                        className="px-2 py-0.5 bg-pink-50 border border-pink-200 text-pink-600 rounded-md text-[10px] font-bold hover:bg-pink-100"
                      >
                        {val}
                      </button>
                    ))}
                  </div>

                  {/* ユニット選択 */}
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">
                      ユニット <span className="text-[10px] font-normal text-slate-400">（選ぶと下のキャラが絞り込まれます）</span>
                    </label>
                    <div className="flex flex-wrap gap-1.5">
                      {UNITS.map(u => {
                        const isSel = (wantedForm.units || []).includes(u.id);
                        return <button type="button" key={u.id} onClick={() => {
                          const curr = wantedForm.units || [];
                          setWantedForm(p => ({ ...p, units: isSel ? curr.filter(x => x !== u.id) : [...curr, u.id] }));
                        }} className={`px-2.5 py-1 rounded-xl text-xs font-semibold border ${isSel ? u.color + ' ring-2' : 'bg-slate-50 text-slate-500'}`}>{isSel ? '✓ ' : ''}{u.name}</button>
                      })}
                    </div>
                  </div>

                  {/* キャラクター選択 */}
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">
                      キャラクター（複数可）
                    </label>
                    <div className="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto p-1.5 border border-pink-100 rounded-xl bg-slate-50/50">
                      {availableCharactersWantedForm.map(c => {
                        const isSel = (wantedForm.characters || []).includes(c.id);
                        return (
                          <button
                            type="button"
                            key={c.id}
                            onClick={() => handleToggleCharacter(setWantedForm, c.id)}
                            className={`px-2 py-1 rounded-lg text-xs font-medium border ${isSel ? 'bg-pink-400 text-white shadow-xs' : 'bg-white text-slate-600'}`}
                          >
                            {isSel ? '✓ ' : ''}{c.name}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">求め条件メモ</label>
                    <textarea rows="2" placeholder="例：同種司と1:1交換希望" value={wantedForm.memo} onChange={e => setWantedForm(p => ({ ...p, memo: e.target.value }))} className="w-full px-3 py-1.5 rounded-xl border border-pink-200 text-xs" />
                  </div>
                  <div className="pt-1">
                    <button type="submit" className="w-full py-3 bg-gradient-to-r from-pink-500 to-rose-400 text-white rounded-2xl font-bold shadow-md">保存する</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ================= ✂️ イラストトリミング専用モーダル ================= */}
          {cropModalOpen && (
            <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md flex items-center justify-center z-50 p-4">
              <div className="bg-white w-full max-w-md rounded-3xl p-4 shadow-2xl flex flex-col space-y-3">
                <div className="flex items-center justify-between border-b pb-2">
                  <h3 className="font-bold text-slate-800 text-xs">✂️ 写真・イラストのトリミング</h3>
                  <button onClick={() => setCropModalOpen(false)} className="text-slate-400 text-base">✕</button>
                </div>

                <div>
                  <div className="grid grid-cols-3 gap-1.5">
                    {[
                      { id: 'square', label: '正方形 (1:1)', icon: '🔲' },
                      { id: 'landscape', label: '横長 (4:3)', icon: '▭' },
                      { id: 'portrait', label: '縦長 (3:4)', icon: '▯' },
                    ].map(asp => (
                      <button
                        key={asp.id}
                        type="button"
                        onClick={() => setCropAspect(asp.id)}
                        className={`py-1.5 rounded-xl text-xs font-bold border flex flex-col items-center justify-center ${
                          cropAspect === asp.id ? 'bg-pink-100 text-pink-700 border-pink-300 ring-2 ring-pink-200' : 'bg-slate-50 text-slate-600'
                        }`}
                      >
                        <span className="text-sm">{asp.icon}</span>
                        <span className="text-[10px]">{asp.label}</span>
                      </button>
                    ))}
                  </div>
                </div>

                <div className="h-48 bg-slate-100 rounded-2xl overflow-hidden flex items-center justify-center border border-slate-200 p-2">
                  <canvas ref={canvasRef} className="max-w-full max-h-full object-contain rounded-lg shadow-xs" />
                </div>

                <div className="space-y-2 text-xs">
                  <div>
                    <div className="flex justify-between text-slate-500 font-semibold mb-0.5 text-[11px]">
                      <span>🔍 ズーム</span><span>{cropZoom.toFixed(1)}x</span>
                    </div>
                    <input type="range" min="1.0" max="2.5" step="0.05" value={cropZoom} onChange={e => setCropZoom(parseFloat(e.target.value))} className="w-full accent-pink-500" />
                  </div>
                  <div>
                    <div className="flex justify-between text-slate-500 font-semibold mb-0.5 text-[11px]">
                      <span>↔️ 横位置</span><span>{cropPosX}%</span>
                    </div>
                    <input type="range" min="0" max="100" value={cropPosX} onChange={e => setCropPosX(parseInt(e.target.value))} className="w-full accent-pink-500" />
                  </div>
                  <div>
                    <div className="flex justify-between text-slate-500 font-semibold mb-0.5 text-[11px]">
                      <span>↕️ 縦位置</span><span>{cropPosY}%</span>
                    </div>
                    <input type="range" min="0" max="100" value={cropPosY} onChange={e => setCropPosY(parseInt(e.target.value))} className="w-full accent-pink-500" />
                  </div>
                </div>

                <button type="button" onClick={confirmCrop} className="w-full py-2.5 bg-gradient-to-r from-pink-500 to-rose-400 text-white rounded-xl font-bold shadow-md text-xs">
                  決定する
                </button>
              </div>
            </div>
          )}

          {/* ================= 絞り込みモーダル ================= */}
          {isFilterOpen && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-end sm:items-center justify-center z-30 p-0 sm:p-4">
              <div className="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[85vh] flex flex-col shadow-2xl animate-in slide-in-from-bottom duration-200">
                <div className="px-5 py-3.5 border-b border-rose-100 flex items-center justify-between">
                  <h2 className="text-base font-bold text-slate-800">絞り込み条件（{activeTab === 'inventory' ? '在庫' : '求め'}）</h2>
                  <button onClick={() => setIsFilterOpen(false)} className="w-8 h-8 rounded-full bg-slate-100 text-slate-500">✕</button>
                </div>
                <div className="p-4 overflow-y-auto space-y-4 text-xs hide-scrollbar">
                  {/* 求めタブ限定：優先度 */}
                  {activeTab === 'wanted' && (
                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1.5">優先度</label>
                      <div className="grid grid-cols-4 gap-1.5">
                        {PRIORITIES.map(p => {
                          const isSel = filterPriorities.includes(p.id);
                          return (
                            <button
                              key={p.id}
                              onClick={() => toggleArray(setFilterPriorities, p.id)}
                              className={`py-1.5 rounded-xl text-xs font-bold border ${isSel ? p.color + ' ring-2' : 'bg-slate-50 text-slate-500'}`}
                            >
                              {p.label}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  )}

                  {/* 在庫タブ限定：レート */}
                  {activeTab === 'inventory' && (
                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1.5">レート（未設定も指定可能）</label>
                      <div className="flex flex-wrap gap-1.5">
                        {FILTER_RATES.map(r => {
                          const isSel = filterRates.includes(r.id);
                          return (
                            <button
                              key={r.id}
                              onClick={() => toggleArray(setFilterRates, r.id)}
                              className={`px-2.5 py-1.5 rounded-xl text-xs font-bold border transition-all ${
                                isSel ? `${r.color} ring-2 ring-rose-300 scale-105` : 'bg-slate-50 text-slate-600 border-slate-200'
                              }`}
                            >
                              {r.label}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  )}

                  {/* 在庫タブ限定：ステータス */}
                  {activeTab === 'inventory' && (
                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1.5">ステータス</label>
                      <div className="flex flex-wrap gap-1.5">
                        {STATUS_OPTIONS.map(s => {
                          const isSel = filterStatuses.includes(s.label);
                          return <button key={s.label} onClick={() => toggleArray(setFilterStatuses, s.label)} className={`px-2.5 py-1 rounded-xl text-xs font-bold border ${isSel ? s.bg + ' ring-2' : 'bg-slate-50 text-slate-500'}`}>{s.label}</button>
                        })}
                      </div>
                    </div>
                  )}

                  {/* グッズの種類 & サブ属性絞り込み */}
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1.5">グッズの種類</label>
                    <div className="flex flex-wrap gap-1 mb-2">
                      {ITEM_TYPES.map(t => {
                        const isSel = filterTypes.includes(t);
                        return <button key={t} onClick={() => toggleArray(setFilterTypes, t)} className={`px-2 py-1 rounded-lg text-[11px] font-medium border ${isSel ? 'bg-pink-100 text-pink-700 border-pink-200' : 'bg-slate-50 text-slate-500'}`}>{t}</button>
                      })}
                    </div>

                    {/* 選択されたグッズの仕様絞り込み（未選択なら全表示） */}
                    {filterTypes.filter(t => ITEM_SUB_OPTIONS[t]).map(t => (
                      <div key={t} className="bg-rose-50/50 p-2 rounded-xl border border-rose-100 mb-1.5">
                        <span className="text-[11px] font-bold text-rose-600 block mb-1">
                          {t}の仕様 <span className="text-[9px] font-normal text-rose-400">（未選択の場合はすべて表示）</span>
                        </span>
                        <div className="flex flex-wrap gap-1">
                          {ITEM_SUB_OPTIONS[t].map(sub => {
                            const isSubSel = (filterSubTypes[t] || []).includes(sub);
                            return (
                              <button
                                key={sub}
                                onClick={() => toggleFilterSubType(t, sub)}
                                className={`px-2 py-0.5 rounded-lg text-xs font-semibold border ${
                                  isSubSel ? 'bg-rose-500 text-white border-rose-500' : 'bg-white text-slate-600'
                                }`}
                              >
                                {isSubSel ? '✓ ' : ''}{sub}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    ))}
                  </div>

                  {/* ユニット選択 */}
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1.5">ユニット（タップで下のキャラ候補が連動）</label>
                    <div className="flex flex-wrap gap-1.5">
                      {UNITS.map(u => {
                        const isSel = filterUnits.includes(u.id);
                        return <button key={u.id} onClick={() => toggleArray(setFilterUnits, u.id)} className={`px-2.5 py-1 rounded-xl text-xs font-bold border ${isSel ? u.color + ' ring-2' : 'bg-slate-50 text-slate-500'}`}>{u.name}</button>
                      })}
                    </div>
                  </div>

                  {/* キャラクター選択 */}
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1.5">
                      キャラクター {filterUnits.length > 0 && <span className="text-[10px] text-pink-500">（選択中ユニットのキャラのみ表示中）</span>}
                    </label>
                    <div className="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto p-1.5 border border-rose-100 rounded-xl bg-slate-50/50">
                      {availableCharactersFilter.map(c => {
                        const isSel = filterCharacters.includes(c.id);
                        return <button key={c.id} onClick={() => toggleArray(setFilterCharacters, c.id)} className={`px-2 py-1 rounded-lg text-[11px] font-medium border ${isSel ? 'bg-purple-100 text-purple-700 border-purple-200' : 'bg-white text-slate-600'}`}>{c.name}</button>
                      })}
                    </div>
                  </div>
                </div>
                <div className="p-3.5 border-t border-rose-100 bg-slate-50/50 rounded-b-3xl">
                  <button onClick={() => setIsFilterOpen(false)} className="w-full py-2.5 bg-gradient-to-r from-pink-400 to-rose-400 text-white rounded-xl font-bold text-xs">結果を表示する</button>
                </div>
              </div>
            </div>
          )}

          {/* 画像拡大モーダル */}
          {previewImage && (
            <div className="fixed inset-0 bg-black/85 flex items-center justify-center z-50 p-4" onClick={() => setPreviewImage(null)}>
              <img src={previewImage} alt="拡大プレビュー" className="max-w-full max-h-[85vh] object-contain rounded-2xl shadow-2xl" />
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
