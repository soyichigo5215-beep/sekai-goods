<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>プロセカ グッズ＆求め管理</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="プロセカ管理">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#fdf2f8">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .bg-overlay {
      background-color: rgba(255, 241, 242, 0.7);
      min-height: 100vh;
    }
  </style>
</head>
<body class="text-slate-700 min-h-screen antialiased selection:bg-pink-200">
  <div id="root" class="bg-overlay pb-28"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- データ定義 ---
    const UNITS = [
      { id: 'vs', name: 'バーチャル・シンガー', color: 'bg-teal-50 text-teal-700 border-teal-200' },
      { id: 'ln', name: 'Leo/need', color: 'bg-sky-50 text-sky-700 border-sky-200' },
      { id: 'mmj', name: 'MORE MORE JUMP！', color: 'bg-lime-50 text-lime-700 border-lime-200' },
      { id: 'vbs', name: 'Vivid BAD SQUAD', color: 'bg-rose-50 text-rose-700 border-rose-200' },
      { id: 'wxs', name: 'ワンダーランズ×ショウタイム', color: 'bg-amber-50 text-amber-700 border-amber-200' },
      { id: 'niigo', name: '25時、ナイトコードで。', color: 'bg-purple-50 text-purple-700 border-purple-200' },
    ];

    const CHARACTERS = [
      { id: 'miku', name: '初音ミク', unit: 'vs' }, { id: 'rin', name: '鏡音リン', unit: 'vs' }, { id: 'len', name: '鏡音レン', unit: 'vs' }, { id: 'luka', name: '巡音ルカ', unit: 'vs' }, { id: 'meiko', name: 'MEIKO', unit: 'vs' }, { id: 'kaito', name: 'KAITO', unit: 'vs' },
      { id: 'ichika', name: '星乃一歌', unit: 'ln' }, { id: 'saki', name: '天馬咲希', unit: 'ln' }, { id: 'honami', name: '望月穂波', unit: 'ln' }, { id: 'shiho', name: '日野森志歩', unit: 'ln' },
      { id: 'minori', name: '花里みのり', unit: 'mmj' }, { id: 'haruka', name: '桐谷遥', unit: 'mmj' }, { id: 'airi', name: '桃井愛莉', unit: 'mmj' }, { id: 'shizuku', name: '日野森雫', unit: 'mmj' },
      { id: 'kohane', name: '小豆沢こはね', unit: 'vbs' }, { id: 'an', name: '白石杏', unit: 'vbs' }, { id: 'akito', name: '東雲彰人', unit: 'vbs' }, { id: 'toya', name: '青柳冬弥', unit: 'vbs' },
      { id: 'tsukasa', name: '天馬司', unit: 'wxs' }, { id: 'emu', name: '鳳えむ', unit: 'wxs' }, { id: 'nene', name: '草薙寧々', unit: 'wxs' }, { id: 'rui', name: '神代類', unit: 'wxs' },
      { id: 'kanade', name: '宵崎奏', unit: 'niigo' }, { id: 'mafuyu', name: '朝比奈まふゆ', unit: 'niigo' }, { id: 'ena', name: '東雲絵名', unit: 'niigo' }, { id: 'mizuki', name: '暁山瑞希', unit: 'niigo' },
    ];

    const ITEM_TYPES = [
      'エピカ', 'エピカ(箔押し)', 'ぱしゃこれ', 'メモステ', 'メモステ(箔押し)',
      '色紙', '特典', 'はぴこれ', '缶バッジ', 'アクリルスタンド', 'キーホルダー', 'クリアファイル', 'その他'
    ];

    // ステータス定義（交換予定に変更 & 予約済を追加）
    const STATUS_OPTIONS = [
      { label: '譲', bg: 'bg-pink-100 text-pink-700 border-pink-200' },
      { label: '求', bg: 'bg-sky-100 text-sky-700 border-sky-200' },
      { label: '所持', bg: 'bg-emerald-100 text-emerald-700 border-emerald-200' },
      { label: '交換予定', bg: 'bg-amber-100 text-amber-700 border-amber-200' },
      { label: '譲渡予定', bg: 'bg-indigo-100 text-indigo-700 border-indigo-200' },
      { label: '予約済', bg: 'bg-teal-100 text-teal-700 border-teal-200' },
      { label: '保留', bg: 'bg-purple-100 text-purple-700 border-purple-200' },
    ];

    // 過去データ互換用（交換中 ➔ 交換予定）
    const normalizeStatus = (st) => (st === '交換中' ? '交換予定' : st);

    // 優先度 4択定義（求め絵柄用）
    const PRIORITIES = [
      { id: '最優先', label: '最優先', color: 'bg-rose-500 text-white shadow-sm shadow-rose-200' },
      { id: '優先', label: '優先', color: 'bg-pink-400 text-white shadow-sm shadow-pink-200' },
      { id: '求', label: '求', color: 'bg-sky-400 text-white shadow-sm shadow-sky-200' },
      { id: '緩求', label: '緩求', color: 'bg-slate-400 text-white' },
    ];

    // レート 5段階定義（在庫管理用・任意）
    const RATES = [
      { id: '激高', label: '激高', color: 'bg-rose-600 text-white', border: 'border-rose-400' },
      { id: '高', label: '高', color: 'bg-amber-500 text-white', border: 'border-amber-400' },
      { id: '普通', label: '普通', color: 'bg-emerald-500 text-white', border: 'border-emerald-400' },
      { id: '低', label: '低', color: 'bg-sky-400 text-white', border: 'border-sky-300' },
      { id: '激低', label: '激低', color: 'bg-slate-400 text-white', border: 'border-slate-300' },
    ];

    // 絞り込み用レート選択肢（未設定を追加）
    const FILTER_RATES = [
      ...RATES,
      { id: '未設定', label: '未設定', color: 'bg-slate-200 text-slate-700', border: 'border-slate-300' },
    ];

    const getPriorityConf = (prio) => {
      if (typeof prio === 'number') {
        if (prio >= 5) return PRIORITIES[0];
        if (prio === 4) return PRIORITIES[1];
        if (prio === 3) return PRIORITIES[2];
        return PRIORITIES[3];
      }
      return PRIORITIES.find(p => p.id === prio) || PRIORITIES[0];
    };

    // --- DB処理 ---
    const DB_NAME = 'SekaiGoodsStorage';
    const DB_STORE = 'goods';
    const openDB = () => new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(DB_STORE, { keyPath: 'id' });
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });

    const loadAllItems = async () => {
      try {
        const db = await openDB();
        return new Promise(resolve => {
          const req = db.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve([]);
        });
      } catch (e) { return []; }
    };
    const saveItemDB = async (item) => {
      const db = await openDB();
      db.transaction(DB_STORE, 'readwrite').objectStore(DB_STORE).put(item);
    };
    const deleteItemDB = async (id) => {
      const db = await openDB();
      db.transaction(DB_STORE, 'readwrite').objectStore(DB_STORE).delete(id);
    };

    // --- 初期フォーム状態 ---
    const initialGoodsForm = { id: '', isWanted: false, name: '', type: 'エピカ', units: [], characters: [], statuses: ['譲'], count: 1, rate: '', memo: '', image: '', createdAt: 0 };
    const initialWantedForm = { id: '', isWanted: true, name: '', types: ['エピカ'], units: [], characters: [], priority: '最優先', memo: '', image: '', createdAt: 0 };

    function App() {
      const [items, setItems] = useState([]);
      const [activeTab, setActiveTab] = useState('inventory'); // 'inventory' | 'wanted'
      
      const [isGoodsModalOpen, setIsGoodsModalOpen] = useState(false);
      const [isWantedModalOpen, setIsWantedModalOpen] = useState(false);
      const [isFilterOpen, setIsFilterOpen] = useState(false);
      const [previewImage, setPreviewImage] = useState(null);

      // 並べ替え状態 ('registered' | 'character' | 'type')
      const [sortBy, setSortBy] = useState('registered');

      // レート比較モード
      const [showRateComparison, setShowRateComparison] = useState(false);

      const [goodsForm, setGoodsForm] = useState(initialGoodsForm);
      const [wantedForm, setWantedForm] = useState(initialWantedForm);

      // 共通トリミングモーダル状態
      const [cropModalOpen, setCropModalOpen] = useState(false);
      const [cropTarget, setCropTarget] = useState('goods');
      const [rawImageSrc, setRawImageSrc] = useState(null);
      const [cropAspect, setCropAspect] = useState('square');
      const [cropZoom, setCropZoom] = useState(1.0);
      const [cropPosX, setCropPosX] = useState(50);
      const [cropPosY, setCropPosY] = useState(50);
      const canvasRef = useRef(null);
      const rawImageRef = useRef(null);

      // 検索・絞り込み状態
      const [searchTerm, setSearchTerm] = useState('');
      const [filterTypes, setFilterTypes] = useState([]);
      const [filterUnits, setFilterUnits] = useState([]);
      const [filterCharacters, setFilterCharacters] = useState([]);
      const [filterStatuses, setFilterStatuses] = useState([]);
      const [filterRates, setFilterRates] = useState([]);
      const [filterPriorities, setFilterPriorities] = useState([]);

      const goodsFileInputRef = useRef(null);
      const wantedFileInputRef = useRef(null);

      useEffect(() => { loadAllItems().then(setItems); }, []);

      const inventoryItems = useMemo(() => items.filter(i => !i.isWanted), [items]);
      const wantedItems = useMemo(() => items.filter(i => i.isWanted), [items]);

      const openAddGoods = () => {
        setGoodsForm({ ...initialGoodsForm, id: 'goods_' + Date.now(), createdAt: Date.now() });
        setIsGoodsModalOpen(true);
      };
      const openEditGoods = (item) => {
        const itemStatuses = (Array.isArray(item.statuses) ? item.statuses : ['譲']).map(normalizeStatus);
        setGoodsForm({
          id: item.id, isWanted: false, name: item.name || '', type: item.type || 'エピカ',
          units: item.units || [], characters: item.characters || [], statuses: itemStatuses,
          count: item.count || 1, rate: item.rate || '', memo: item.memo || '', image: item.image || '',
          createdAt: item.createdAt || 0
        });
        setIsGoodsModalOpen(true);
      };

      const openAddWanted = () => {
        setWantedForm({ ...initialWantedForm, id: 'wanted_' + Date.now(), createdAt: Date.now() });
        setIsWantedModalOpen(true);
      };
      const openEditWanted = (item) => {
        setWantedForm({
          id: item.id, isWanted: true, name: item.name || '', types: item.types || ['エピカ'],
          units: item.units || [], characters: item.characters || [],
          priority: getPriorityConf(item.priority).id,
          memo: item.memo || '', image: item.image || '',
          createdAt: item.createdAt || 0
        });
        setIsWantedModalOpen(true);
      };

      const handleSave = async (dataToSave, closeModal) => {
        const itemWithTime = {
          ...dataToSave,
          createdAt: dataToSave.createdAt || Date.now()
        };
        await saveItemDB(itemWithTime);
        setItems(prev => {
          const idx = prev.findIndex(i => i.id === itemWithTime.id);
          return idx >= 0 ? [...prev.slice(0,idx), itemWithTime, ...prev.slice(idx+1)] : [itemWithTime, ...prev];
        });
        closeModal();
      };

      const handleDelete = async (id) => {
        if (!confirm('削除してよろしいですか？')) return;
        await deleteItemDB(id);
        setItems(prev => prev.filter(i => i.id !== id));
      };

      // キャラ選択時に所属ユニットを自動付与
      const handleToggleCharacter = (formSetter, charId) => {
        const charObj = CHARACTERS.find(c => c.id === charId);
        formSetter(prev => {
          const currChars = prev.characters || [];
          const currUnits = prev.units || [];
          const isSelected = currChars.includes(charId);
          
          let nextChars = isSelected ? currChars.filter(x => x !== charId) : [...currChars, charId];
          let nextUnits = [...currUnits];

          if (!isSelected && charObj && charObj.unit && !nextUnits.includes(charObj.unit)) {
            nextUnits.push(charObj.unit);
          }

          return { ...prev, characters: nextChars, units: nextUnits };
        });
      };

      // --- 画像選択 & トリミング起動 ---
      const handleImageSelect = (e, target) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          setCropTarget(target);
          setRawImageSrc(evt.target.result);
          setCropZoom(1.0);
          setCropPosX(50);
          setCropPosY(50);
          setCropModalOpen(true);
        };
        reader.readAsDataURL(file);
      };

      useEffect(() => {
        if (!cropModalOpen || !rawImageSrc || !canvasRef.current) return;
        const img = new Image();
        img.src = rawImageSrc;
        rawImageRef.current = img;
        img.onload = () => drawCropPreview();
      }, [cropModalOpen, rawImageSrc, cropAspect, cropZoom, cropPosX, cropPosY]);

      const getAspectDimensions = (aspect) => {
        if (aspect === 'landscape') return { w: 600, h: 450 };
        if (aspect === 'portrait') return { w: 450, h: 600 };
        return { w: 500, h: 500 };
      };

      const drawCropPreview =
